name: Validate platform

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: tennis_ai_test
      POSTGRES_USER: tennis_ai
      # Disposable credentials for this isolated CI service, never a deployment secret.
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      STORAGE_LOCAL_PATH: /tmp/tennis-ai-ci-media
      APP_ENV_FILE: .env.example
      RUN_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: tennis_ai_test
          POSTGRES_USER: tennis_ai
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U tennis_ai -d tennis_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install system tools and locked dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg shellcheck
          python -m pip install --require-hashes -r backend/requirements-dev.txt
          python -m pip check
      - name: Lint and validate configuration
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          shellcheck .devcontainer/scripts/*.sh infra/scripts/*.sh
          docker compose --env-file infra/.env.example -f infra/compose.yaml --profile app config --quiet
      - name: Apply migrations and test PostgreSQL integration
        run: |
          alembic -c backend/alembic.ini upgrade head
          python -m pytest -c backend/pyproject.toml
          alembic -c backend/alembic.ini check
      - name: Build and verify runtime image
        run: |
          docker build -f infra/backend.Dockerfile -t tennis-ai-backend:ci .
          docker run --rm --read-only --entrypoint python tennis-ai-backend:ci -c 'import os, shutil; assert os.getuid() == 10001; assert shutil.which("ffprobe")'

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - name: Analyze, test, and build Android
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --debug

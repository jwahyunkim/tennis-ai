name: tennis-ai

x-backend: &backend
  image: tennis-ai-backend:${APP_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  profiles: [app]
  env_file: ${APP_ENV_FILE:-.env}
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    STORAGE_LOCAL_PATH: /data/media
    WORKER_HEARTBEAT_PATH: /data/media/worker-heartbeat
  volumes:
    - media_data:/data/media
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=536870912,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  mem_limit: 1536m
  cpus: 2
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tennis_ai}
      POSTGRES_USER: ${POSTGRES_USER:-tennis_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores versioned data directories under this mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=6).close()"
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *backend
    command: [python, -m, backend.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, backend.worker, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 100s
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
